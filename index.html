<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valentine</title>

<style>
:root {
  --pink1: #ff9ecf;
  --pink2: #ff6fa5;
  --pink3: #ff3d86;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: Arial, sans-serif;
  background: linear-gradient(-45deg, var(--pink1), var(--pink2), var(--pink3));
  background-size: 400% 400%;
  animation: bgmove 10s ease infinite;
  overflow: hidden;
}

.container {
  text-align: center;
  padding: 20px;
  width: 90%;
  max-width: 500px;
  z-index: 3;
}

h1 {
  font-size: clamp(26px, 5vw, 42px);
  color: white;
  margin-bottom: 30px;
}

.buttons {
  display: flex;
  justify-content: center;
  gap: 20px;
}

button {
  padding: 12px 26px;
  font-size: clamp(14px, 3vw, 18px);
  border: none;
  border-radius: 30px;
  cursor: pointer;
}

#yes {
  background: #28a745;
  color: white;
  animation: heartbeat 1.2s infinite;
}

#no {
  background: #dc3545;
  color: white;
  position: relative;
}

canvas {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 1;
}

.message {
  position: fixed;
  top: 6%;
  left: 50%;
  transform: translateX(-50%);
  font-size: clamp(22px, 4vw, 34px);
  color: white;
  font-weight: bold;
  opacity: 0;
  z-index: 4;
  text-align: center;
  padding: 0 16px;
}

.show {
  opacity: 1;
  transition: opacity 1s ease;
}

.balloon {
  position: fixed;
  bottom: -120px;
  width: 38px;
  height: 50px;
  border-radius: 50% 50% 45% 45%;
  animation: float 6s linear forwards;
  z-index: 2;
}

.balloon::after {
  content: "";
  position: absolute;
  bottom: -18px;
  left: 50%;
  width: 2px;
  height: 18px;
  background: white;
  transform: translateX(-50%);
}

@keyframes float {
  from { transform: translateY(0) }
  to { transform: translateY(-120vh) }
}

@keyframes bgmove {
  0% { background-position: 0% 50% }
  50% { background-position: 100% 50% }
  100% { background-position: 0% 50% }
}

@keyframes heartbeat {
  0% { transform: scale(1) }
  25% { transform: scale(1.1) }
  50% { transform: scale(1) }
  75% { transform: scale(1.1) }
  100% { transform: scale(1) }
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div class="container">
  <h1>Will you be my Valentine? ❤️</h1>
  <div class="buttons">
    <button id="yes">Yes</button>
    <button id="no">No</button>
  </div>
</div>

<div id="msg" class="message">
I LOVE YOU PRETTY, SEE YOUU SOON PRETTY!
</div>

<script>
const canvas = document.getElementById("canvas")
const ctx = canvas.getContext("2d")
const yesBtn = document.getElementById("yes")
const noBtn = document.getElementById("no")
const msg = document.getElementById("msg")

function resizeCanvas() {
  canvas.width = innerWidth
  canvas.height = innerHeight
}
resizeCanvas()
addEventListener("resize", resizeCanvas)

noBtn.addEventListener("mouseenter", moveNo)
noBtn.addEventListener("touchstart", moveNo)

function moveNo() {
  const x = Math.random() * (innerWidth - noBtn.offsetWidth)
  const y = Math.random() * (innerHeight - noBtn.offsetHeight)
  noBtn.style.position = "fixed"
  noBtn.style.left = x + "px"
  noBtn.style.top = y + "px"
}

yesBtn.addEventListener("click", () => {
  drawHeart()
  balloons()
  confetti()
})

function drawHeart() {
  const cx = canvas.width / 2
  const cy = canvas.height / 2
  const scale = 15
  let t = 0

  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height)

    ctx.beginPath()
    for (let i = 0; i < t; i += 0.02) {
      const x = 16 * Math.sin(i) ** 3
      const y = 13 * Math.cos(i) - 5 * Math.cos(2*i) - 2 * Math.cos(3*i) - Math.cos(4*i)
      ctx.lineTo(cx + x * scale, cy - y * scale)
    }
    ctx.strokeStyle = "white"
    ctx.lineWidth = 4
    ctx.stroke()

    t += 0.05
    if (t < Math.PI * 2) {
      requestAnimationFrame(animate)
    } else {
      msg.classList.add("show")
    }
  }

  animate()
}

function balloons() {
  for (let i = 0; i < 10; i++) {
    const b = document.createElement("div")
    b.className = "balloon"
    b.style.left = Math.random() * 100 + "vw"
    b.style.background = "hsl(" + Math.random() * 360 + ",70%,60%)"
    b.style.animationDuration = 4 + Math.random() * 3 + "s"
    document.body.appendChild(b)
    setTimeout(() => b.remove(), 7000)
  }
}

function confetti() {
  const pieces = []
  for (let i = 0; i < 150; i++) {
    pieces.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      size: 4 + Math.random() * 4,
      speed: 2 + Math.random() * 3,
      drift: Math.random() * 2 - 1,
      color: "hsl(" + Math.random() * 360 + ",100%,60%)"
    })
  }

  let frame = 0
  function fall() {
    frame++
    ctx.save()
    pieces.forEach(p => {
      ctx.fillStyle = p.color
      ctx.fillRect(p.x, p.y, p.size, p.size)
      p.y += p.speed
      p.x += p.drift
    })
    ctx.restore()

    if (frame < 120) {
      requestAnimationFrame(fall)
    }
  }
  fall()
}
</script>

</body>
</html>
